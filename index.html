<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kipakolás</title>

<!-- Alkalmazás-beállítások (Android) -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a73e8">

<!-- iPhone -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kipakolás">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<!-- Böngészőfül ikon -->
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<style>
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #f1f3f4;
  }
  #app {
    position: fixed; inset: 0; width: 100%; height: 100%;
    border: 0; display: block;
  }
  #loading {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    font-family: -apple-system, Roboto, Arial, sans-serif; color: #5f6368;
    background: #f1f3f4; transition: opacity .3s;
  }
  #loading img { width: 96px; height: 96px; }
  #loading.hide { opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<div id="loading">
  <img src="icon-192.png" alt="">
  <div>Betöltés…</div>
</div>

<iframe id="app" title="Kipakolás" allow="clipboard-write"></iframe>

<script>
  // A webalkalmazás /exec végű linkje
  var APP_URL = 'https://script.google.com/macros/s/AKfycbwSFGavlyuwzqr9-Bfu4a2pPCC1QoGrnOj6x3FNE8D2NlvCoIN5SsE6RgGDQ2FjOHTW/exec';

  var frame = document.getElementById('app');
  frame.addEventListener('load', function () {
    document.getElementById('loading').classList.add('hide');
  });
  frame.src = APP_URL;
</script>
</body>
</html>
