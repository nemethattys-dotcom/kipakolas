<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gokart beírás</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#15181e">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Gokart">
<style>
  html, body { margin: 0; height: 100%; background: #15181e; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #f4f5f7; }
  #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
         color: #fff; font: 16px system-ui, sans-serif; text-align: center; padding: 20px; }
</style>
</head>
<body>
<div id="msg">Betöltés…</div>
<script>
  // A webalkalmazás linkje (/exec)
  var APP_URL = 'https://script.google.com/macros/s/AKfycbz0YFpF1c9wKJ94YUv2eOTELdvLb43o7GKu8WfXOc97-rtjwDfoEmbyGdipyX0hgth9/exec';

  // A burok linkjének végére írt ?b=hck stb. továbbmegy az alkalmazásnak
  var url = APP_URL + (location.search || '');
  var f = document.createElement('iframe');
  f.src = url;
  f.allow = 'camera; clipboard-write';
  f.onload = function () { document.getElementById('msg').style.display = 'none'; };
  document.body.appendChild(f);

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
